# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: CloudBank Classroom Docs
  description: Documentation for CloudBank Classroom
  github: cloudbank-project/cloudbank-classroom-docs
  jupyter: true
  toc:
    - file: intro.md

site:
  template: book-theme
  parts:
    # Replaces the default "Made with MyST" sidebar badge. The target file is
    # intentionally empty, which renders nothing at all.
    primary_sidebar_footer: _static/sidebar-footer.md
  actions:
    - title: Open Issue
      url: https://github.com/cloudbank-project/cloudbank-classroom-docs/issues/new
  options:
    logo: _static/cloudbank.png
    favicon: _static/favicon.ico
    style: _static/custom.css
    outline_maxdepth: 2
