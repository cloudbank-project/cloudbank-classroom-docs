# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: CloudBank Classroom Docs
  description: Documentation for CloudBank Classroom
  github: cloudbank-project/cloudbank-classroom-docs
  jupyter: true
  exclude:
    # Generated by scripts/generate_hub_table.py and pulled in with
    # an {include}; not a page of its own.
    - getting-started/_hub-table.md
  toc:
    - file: intro.md
    - title: Getting Started
      children:
        - file: getting-started/hub-url.md
        - file: getting-started/authentication.md
    - title: User Environments
      children:
        - file: environments/cpu.md
        - file: environments/gpu.md
        - file: environments/packages.md
        - file: environments/limits.md
    - title: Files and Data
      children:
        - file: files/loading-files.md
        - file: files/sharing.md
    - title: AI Tools
      children:
        - file: ai-tools/jupyter-ai.md
        - file: ai-tools/jupytutor.md
    - file: best-practices/index.md
      children:
        - file: best-practices/rstudio.md
        - file: best-practices/inference.md
        - file: best-practices/notebooks-and-git.md
    - file: administration.md
    - file: getting-help.md

site:
  template: book-theme
  parts:
    # Replaces the default "Made with MyST" sidebar badge. The target file is
    # intentionally empty, which renders nothing at all.
    primary_sidebar_footer: _static/sidebar-footer.md
  actions:
    - title: Open Issue
      url: https://github.com/cloudbank-project/cloudbank-classroom-docs/issues/new
  options:
    logo: _static/cloudbank.png
    favicon: _static/favicon.ico
    style: _static/custom.css
    outline_maxdepth: 2
    # Keep source folders in page URLs (/environments/cpu, not /cpu). Without
    # this MyST flattens to the bare filename, which collides across folders.
    folders: true
